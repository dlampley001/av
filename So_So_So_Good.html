<!DOCTYPE html>
<html>
<head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p,iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<div id="p"></div>
<script>
const id = new URLSearchParams(location.search).get('v');
let unmuted = false;
function onYouTubeIframeAPIReady() {
  new YT.Player('p', {
    width: '100%', height: '100%', videoId: id,
    playerVars: { autoplay: 1, mute: 1, controls: 0, rel: 0, playsinline: 1 },
    events: {
      onReady: e => { e.target.mute(); e.target.playVideo(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING && !unmuted) {
          unmuted = true;
          e.target.unMute();
          e.target.setVolume(100);
        }
      }
    }
  });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
